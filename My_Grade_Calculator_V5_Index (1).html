<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{
      --bg:#071A33;--card:#0D2747;--card2:#12345A;--entry:#102F52;
      --fg:#fff;--muted:#B9D8FF;--accent:#1769AA;--green:#237A57;
      --red:#7A3340;--yellow:#FFD166;--shadow:0 10px 30px rgba(0,0,0,.16);
      --radius:16px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh}
    button,input,select,textarea{font:inherit}
    button{border:0;border-radius:10px;padding:10px 14px;color:#fff;cursor:pointer;font-weight:700;transition:.18s ease}
    button:hover{transform:translateY(-1px);filter:brightness(1.08)}
    button:active{transform:translateY(0)}
    input,select,textarea{background:var(--entry);color:var(--fg);border:1px solid transparent;border-radius:10px;padding:10px 12px;outline:none;transition:.18s ease}
    input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
    .header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb,var(--card2) 65%,transparent);gap:18px}
    .title{font-size:25px;font-weight:850;letter-spacing:-.3px;white-space:nowrap}.header-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
    .layout{display:flex;min-height:calc(100vh - 78px);padding:18px 18px 56px;gap:16px;max-width:1500px;margin:auto}
    .sidebar{width:220px;flex:0 0 220px;background:var(--card);border:1px solid color-mix(in srgb,var(--card2) 70%,transparent);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;box-shadow:var(--shadow);height:fit-content;position:sticky;top:96px}
    .nav{background:transparent;text-align:left;color:var(--fg);margin:2px 0;padding:12px 13px;border-radius:10px;opacity:.86}.nav.active{background:var(--accent);opacity:1}.nav:hover{background:var(--card2)}.nav.active:hover{background:var(--accent)}
    .side-info{margin-top:18px;color:var(--muted);font-size:11px;line-height:1.6;padding:12px;border-top:1px solid var(--card2)}
    .content{flex:1;min-width:0;max-width:1180px;margin:auto;padding:0 2px;overflow:auto}.page-title{font-size:25px;font-weight:850;letter-spacing:-.4px;margin:3px 0 18px}
    .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid color-mix(in srgb,var(--card2) 65%,transparent);border-radius:var(--radius);padding:18px;box-shadow:0 5px 18px rgba(0,0,0,.08)}
    .metric-icon{font-size:22px}.metric-title{color:var(--muted);font-size:12px;margin-top:6px}.metric-value{color:var(--accent);font-weight:850;font-size:16px;margin-top:6px;line-height:1.35}
    .lower{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.section-title{font-size:15px;font-weight:850;margin-bottom:15px}
    .dist-row{display:flex;align-items:center;gap:8px;margin:10px 0}.bar{height:9px;background:var(--card2);flex:1;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
    .subject-grid{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:12px}.subject-card{background:var(--card);border:1px solid color-mix(in srgb,var(--card2) 70%,transparent);border-radius:var(--radius);padding:16px;box-shadow:0 5px 18px rgba(0,0,0,.08)}
    .subject-name{font-size:17px;font-weight:850;margin-bottom:8px}.muted{color:var(--muted)}.row{display:flex;gap:7px;align-items:center}.row>*{flex:1}.row button{flex:0 0 auto}
    .small-btn{font-size:12px;padding:8px 10px}.accent{background:var(--accent)}.green{background:var(--green)}.red{background:var(--red)}.purple{background:#5C4B8A}.dark{background:#3B4252}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.search{width:260px}.toolbar .page-title{margin:0}
    .calendar-head{background:var(--card);border:1px solid var(--card2);padding:12px 14px;border-radius:12px;display:flex;align-items:center;justify-content:space-between}.calendar-head b{text-transform:capitalize;font-size:17px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}.weekday{text-align:center;color:var(--muted);font-size:12px;padding:7px;font-weight:800}.day{min-height:72px;background:var(--card);border:1px solid var(--card2);padding:9px;text-align:left;border-radius:10px}.day.today{outline:2px solid var(--green)}.day.selected{background:var(--accent);border-color:var(--accent)}.day.homework{box-shadow:inset 0 -4px 0 var(--yellow)}
    .homework{background:var(--card);border:1px solid var(--card2);padding:16px;border-radius:var(--radius);margin-top:12px}.homework-list{margin-top:10px;display:grid;gap:7px}
    .notes{display:grid;grid-template-columns:220px 1fr;gap:12px;min-height:500px}.list{background:var(--card);border:1px solid var(--card2);padding:8px;border-radius:var(--radius);height:fit-content}.list button{width:100%;text-align:left;background:transparent;margin:2px 0;color:var(--fg)}.list button.selected{background:var(--accent)}.list button:hover{background:var(--card2)}.list button.selected:hover{background:var(--accent)}
    textarea.note{width:100%;min-height:390px;resize:vertical;line-height:1.55}.ach-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.locked{opacity:.5}
    .settings{display:grid;gap:12px;max-width:760px}.setting-card{background:var(--card);border:1px solid var(--card2);padding:20px;border-radius:var(--radius)}.setting-line{display:grid;grid-template-columns:130px 1fr auto;align-items:center;gap:12px;margin:10px 0}.setting-line select{width:100%}
    .status{position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in srgb,var(--card) 94%,black);color:var(--muted);padding:8px 18px;font-size:12px;border-top:1px solid var(--card2)}
    @media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.subject-grid{grid-template-columns:repeat(2,minmax(250px,1fr))}.sidebar{width:190px;flex-basis:190px}}
    @media(max-width:760px){.header{padding:14px 12px;align-items:flex-start;flex-direction:column}.title{font-size:21px}.header-actions{width:100%;justify-content:flex-start}.layout{display:block;padding:10px 10px 55px}.sidebar{position:static;width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:7px;margin-bottom:12px}.nav{padding:10px 7px;text-align:center;font-size:12px}.side-info{display:none}.cards,.lower,.subject-grid,.ach-grid,.notes{grid-template-columns:1fr}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.setting-line{grid-template-columns:1fr}.calendar{gap:3px}.day{min-height:56px;padding:6px;font-size:12px}.weekday{padding:5px;font-size:10px}.row{flex-wrap:wrap}.row>*{min-width:110px}.content{overflow:visible}.status{font-size:11px}}
    @media(max-width:430px){.sidebar{grid-template-columns:repeat(2,1fr)}.header-actions button{flex:1}.calendar-head{gap:6px}.calendar-head button{padding:8px}.day{min-height:48px;font-size:11px}.subject-card,.card{padding:14px}}
  
/* =========================
   PHONE-FIRST MOBILE UI
   ========================= */
@media (max-width: 700px) {
  html { font-size: 15px; }
  body {
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    display: block !important;
    min-height: 100vh;
    padding-bottom: 76px;
  }

  /* Hide desktop sidebar and replace it with bottom navigation */
  .sidebar {
    position: fixed !important;
    z-index: 1000;
    left: 0;
    right: 0;
    bottom: 0;
    top: auto !important;
    width: 100% !important;
    height: 68px;
    min-height: 68px;
    padding: 7px 6px calc(7px + env(safe-area-inset-bottom));
    border-right: 0 !important;
    border-top: 1px solid var(--border);
    background: color-mix(in srgb, var(--panel) 94%, transparent);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    display: flex !important;
    flex-direction: row !important;
    align-items: center;
    justify-content: space-around;
    gap: 2px;
  }

  .sidebar .brand,
  .sidebar .nav-title,
  .sidebar .sidebar-footer {
    display: none !important;
  }

  .sidebar nav {
    width: 100%;
    display: flex !important;
    justify-content: space-around;
    align-items: center;
    gap: 2px;
  }

  .nav-item {
    flex: 1;
    min-width: 0;
    min-height: 52px;
    padding: 5px 2px !important;
    border-radius: 12px !important;
    display: flex !important;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px !important;
    font-size: 10px !important;
    line-height: 1.1;
    white-space: nowrap;
  }

  .nav-item .icon,
  .nav-item span:first-child {
    font-size: 20px !important;
    line-height: 1;
  }

  .main {
    width: 100%;
    min-width: 0;
    padding: 0 12px 20px !important;
  }

  .topbar {
    position: sticky !important;
    top: 0;
    z-index: 900;
    margin: 0 -12px 12px !important;
    padding: 11px 12px !important;
    min-height: 58px;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }

  .topbar h1,
  .page-title {
    font-size: 20px !important;
    margin: 0 !important;
  }

  .topbar .actions {
    gap: 5px !important;
  }

  .topbar .actions button {
    min-width: 40px;
    min-height: 40px;
    padding: 8px !important;
  }

  .content {
    max-width: none !important;
    width: 100%;
    padding: 0 !important;
  }

  /* Dashboard */
  .metrics,
  .stats-grid,
  .dashboard-grid,
  .grid,
  .cards {
    grid-template-columns: 1fr !important;
    gap: 10px !important;
  }

  .metric-card,
  .card,
  .panel,
  .subject-card,
  .settings-card,
  .achievement-card {
    border-radius: 16px !important;
    padding: 14px !important;
  }

  .metric-card .value {
    font-size: 27px !important;
  }

  .progress {
    height: 9px !important;
  }

  /* Subjects */
  .subject-card {
    display: block !important;
  }

  .subject-header {
    gap: 8px !important;
    margin-bottom: 10px !important;
  }

  .subject-header h3 {
    font-size: 16px !important;
  }

  .subject-actions {
    width: 100%;
    display: grid !important;
    grid-template-columns: 1fr 1fr;
    gap: 7px !important;
  }

  input, select, textarea, button {
    font-size: 16px !important; /* prevents iOS zoom */
  }

  input, select, button {
    min-height: 44px;
  }

  textarea {
    min-height: 110px;
  }

  .btn,
  button {
    border-radius: 11px !important;
  }

  /* Avoid cramped horizontal tables */
  .table-wrap {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 12px;
  }

  table {
    min-width: 620px;
  }

  /* Calendar */
  .calendar {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .calendar-grid {
    min-width: 520px;
  }

  .calendar-controls {
    display: grid !important;
    grid-template-columns: 44px 1fr 44px;
    gap: 7px !important;
  }

  .calendar-controls button {
    min-width: 44px;
    padding: 0 !important;
  }

  /* Notes */
  .notes-layout {
    display: flex !important;
    flex-direction: column !important;
    gap: 10px !important;
  }

  .notes-list {
    max-height: 180px !important;
    overflow-y: auto;
  }

  /* Settings */
  .setting-row {
    display: flex !important;
    flex-direction: column !important;
    align-items: stretch !important;
    gap: 8px !important;
  }

  .setting-row label {
    font-weight: 600;
  }

  /* Hide nonessential decorative elements on very small screens */
  .desktop-only {
    display: none !important;
  }

  /* Toast/status should stay above bottom nav */
  .toast,
  .status-bar {
    bottom: 78px !important;
  }
}

@media (max-width: 380px) {
  .main { padding-left: 9px !important; padding-right: 9px !important; }
  .topbar { margin-left: -9px !important; margin-right: -9px !important; }
  .nav-item { font-size: 9px !important; }
  .nav-item .icon,
  .nav-item span:first-child { font-size: 18px !important; }
  .metric-card .value { font-size: 24px !important; }
}


/* Google-style 9-dot app launcher */
.brand-row{display:flex;align-items:center;gap:14px;min-width:0}
.launcher-toggle{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;padding:8px;background:transparent;border-radius:12px;color:var(--fg)}
.launcher-toggle:hover,.launcher-toggle.open{background:var(--card2)}
.dot-grid{display:grid;grid-template-columns:repeat(3,4px);grid-template-rows:repeat(3,4px);gap:3px}
.dot-grid i{display:block;width:4px;height:4px;background:currentColor;border-radius:50%}
.launcher-menu{position:fixed;z-index:1001;top:70px;left:16px;width:min(310px,calc(100vw - 24px));padding:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;background:var(--card);border:1px solid var(--card2);border-radius:20px;box-shadow:0 18px 55px rgba(0,0,0,.32)}
.launcher-menu[hidden]{display:none!important}
.launcher-item{min-width:0;min-height:88px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:transparent;color:var(--fg);border-radius:14px;font-size:12px;font-weight:650;overflow-wrap:anywhere}
.launcher-item:hover,.launcher-item.active{background:var(--card2);filter:none;transform:none}
.launcher-item.active{outline:1px solid var(--accent)}

.sidebar{display:none!important}
@media(max-width:760px){
 .header{flex-direction:row!important;align-items:center!important;gap:8px;padding:10px 12px!important}
 .brand-row{gap:9px}.title{font-size:18px!important;white-space:normal}
 .header-actions{width:auto!important;gap:4px!important;flex-wrap:nowrap!important}
 .header-actions button{font-size:0!important;padding:9px!important;min-width:38px;min-height:38px}
 .header-actions button:first-child{font-size:0!important}
 .layout{display:block;padding:12px 10px 55px!important}
 .launcher-menu{top:62px;left:8px}
}
@media(max-width:430px){.brand-row{gap:6px}.launcher-toggle{width:38px;height:38px;flex-basis:38px}.title{font-size:16px!important}.header-actions button{flex:0 0 36px!important;min-width:36px!important;padding:7px!important}.launcher-menu{width:min(290px,calc(100vw - 16px));padding:10px;gap:4px}.launcher-item{min-height:82px;font-size:11px}}

.subject-topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.subject-name{font-size:19px;font-weight:850;margin:0}.subject-subtitle{font-size:12px;color:var(--muted);margin-top:4px}.grade-chip{display:grid;place-items:center;min-width:42px;height:42px;padding:0 10px;border-radius:14px;background:color-mix(in srgb,var(--grade-color) 18%,var(--entry));border:1px solid color-mix(in srgb,var(--grade-color) 55%,transparent);color:var(--grade-color);font-size:21px;font-weight:900}

/* Version 3: planner, weekly insights, focus timer and sync UI */

function splitSpeechText(text,max=1500){let left=String(text||"").replace(/\r/g,"").trim(),parts=[];while(left.length>max){let cut=Math.max(left.lastIndexOf(". ",max),left.lastIndexOf("! ",max),left.lastIndexOf("? ",max),left.lastIndexOf("\n",max));if(cut<Math.floor(max*.45))cut=left.lastIndexOf(" ",max);if(cut<1)cut=max;else if(left[cut]==="."||left[cut]==="!"||left[cut]==="?")cut++;parts.push(left.slice(0,cut).trim());left=left.slice(cut).trim()}if(left)parts.push(left);return parts}

function speakNextChunk(session=speechSessionId){if(session!==speechSessionId||speechWasCancelled)return;if(speechChunkIndex>=speechChunks.length){readerStatus("✓ Finished reading all text.");speechChunks=[];speechChunkIndex=0;return}let utter=new SpeechSynthesisUtterance(speechChunks[speechChunkIndex]);utter.lang=speechLanguage;utter.rate=speechRate;let voices=speechSynthesis.getVoices(),voice=speechVoiceName?voices.find(v=>v.name===speechVoiceName):null;if(!voice){let prefix=speechLanguage.toLowerCase().split("-")[0];voice=(prefix==="uz"?voices.find(isUzbekVoice):null)||voices.find(v=>String(v.lang||"").toLowerCase().startsWith(prefix))||voices.find(v=>v.default)||null}if(voice)utter.voice=voice;utter.onstart=()=>{if(session!==speechSessionId)return;let pct=Math.round(speechChunkIndex/Math.max(1,speechChunks.length)*100);readerStatus((speechUsingFallback?"🔊 Reading with device voice (Uzbek pronunciation may vary) · section ":"🔊 Reading · section ")+(speechChunkIndex+1)+" of "+speechChunks.length+" (about "+pct+"% through)")};utter.onend=()=>{if(session!==speechSessionId)return;speechChunkIndex++;speakNextChunk(session)};utter.onerror=e=>{if(session!==speechSessionId||e&&e.error==="canceled")return;readerStatus("Voice stopped or unavailable. Try another voice or browser.")};speechSynthesis.speak(utter)}

function restoreCloudBackup(){if(!cloudAvailable())return alert("Sign in first to access your cloud backup.");if(!confirm("Replace current data with your latest account backup? Export a backup first if needed."))return;google.script.run.withSuccessHandler(r=>{if(r&&r.data){try{hydrate(JSON.parse(r.data));setStatus("✓ Account backup restored")}catch(e){alert("Could not read cloud data: "+e.message)}}else setStatus("No account backup is saved yet.")}).withFailureHandler(e=>alert("Restore failed: "+(e&&e.message||"Cloud error"))).mgcLoadAccountData(ACCOUNT_TOKEN)}
function clearCloudBackup(){if(!cloudAvailable())return alert("Sign in first to manage your cloud backup.");if(!confirm("Permanently delete this account's cloud backup? Local data on this device will remain."))return;google.script.run.withSuccessHandler(()=>setStatus("Account cloud backup deleted.")).withFailureHandler(e=>alert("Could not delete cloud backup: "+(e&&e.message||"error"))).mgcClearAccountData(ACCOUNT_TOKEN)}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="my-grade-calculator-backup-"+localDateString(new Date())+".json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);setStatus("✓ Backup file exported")}
function importDataFile(input){let file=input.files&&input.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let incoming=JSON.parse(reader.result);if(!confirm("Import this backup and replace the current data?"))return;data=normaliseData(incoming);logActivity("import","backup imported");saveData(true);render();setStatus("✓ Backup imported and saved")}catch(e){alert("Import failed. Please choose a valid My Grade Calculator JSON backup.\n"+e.message)}finally{input.value=""}};reader.onerror=()=>alert("Could not read this file.");reader.readAsText(file)}
function enableNotifications(){if(!("Notification" in window))return alert("This browser does not support notifications.");Notification.requestPermission().then(p=>{if(p==="granted"){data.notifications=true;saveData(true);checkUpcomingNotifications();setStatus("✓ Deadline notifications enabled");render()}else setStatus("Notifications were not enabled. Check browser permissions.")})}
function testNotification(){if(!("Notification" in window))return alert("This browser does not support notifications.");if(Notification.permission!=="granted")return enableNotifications();new Notification("My Grade Calculator",{body:"Notifications are working. Keep up with your study plan!"})}
function checkUpcomingNotifications(){if(!data.notifications||!("Notification" in window)||Notification.permission!=="granted")return;let today=localDateString(new Date()),tomorrowDate=new Date();tomorrowDate.setDate(tomorrowDate.getDate()+1);let tomorrow=localDateString(tomorrowDate);data.events.filter(e=>!e.done&&(e.date===today||e.date===tomorrow)).forEach(e=>{let key="mgc-notified-"+e.id+"-"+today;if(sessionStorage.getItem(key))return;try{new Notification("Upcoming: "+e.name,{body:(e.date===today?"Due today":"Due tomorrow")+(e.time?" at "+e.time:"")+" · "+e.type});sessionStorage.setItem(key,"1")}catch(_){}})}
function clearAll(){if(!confirm("Clear all grades, notes, planner items, and activity from this device? This will also sync the empty data if cloud sync is active."))return;let keep={theme:data.theme,language:data.language,goal:data.goal};data=emptyData();data.theme=keep.theme;data.language=keep.language;data.goal=keep.goal;logActivity("reset","data cleared");saveData(true);render();setStatus("✓ Device data cleared")}
function focusPage(c){let secs=focusSeconds,mm=String(Math.floor(secs/60)).padStart(2,"0"),ss=String(secs%60).padStart(2,"0"),pct=focusInitialSeconds?((focusInitialSeconds-secs)/focusInitialSeconds*100):0;c.innerHTML=`<div class="page-title">⏱️ Focus Timer</div><div class="focus-wrap"><section class="card" style="text-align:center"><div class="section-title">One task. Full attention.</div><div class="focus-presets"><button class="${focusInitialSeconds===15*60?"active":""}" onclick="setFocusLength(15)">15 min</button><button class="${focusInitialSeconds===25*60?"active":""}" onclick="setFocusLength(25)">25 min · Pomodoro</button><button class="${focusInitialSeconds===50*60?"active":""}" onclick="setFocusLength(50)">50 min</button></div><div class="focus-clock" id="focusClock" style="--focus-progress:${pct}%"><div class="focus-clock-content"><div class="focus-time" id="focusTime">${mm}:${ss}</div><div id="focusState">${focusRunning?"Stay focused": "Ready when you are"}</div></div></div><input id="focusTask" style="width:100%;max-width:420px" placeholder="What are you focusing on? (optional)"><div class="focus-controls">${focusRunning?`<button class="purple" onclick="pauseFocus()">Ⅱ Pause</button>`:`<button class="green" onclick="startFocus()">▶ Start focus</button>`}<button class="accent" onclick="finishFocus()">✓ Save session</button><button class="red" onclick="resetFocus()">↻ Reset</button></div><div class="focus-tip">💡 <b>Tip:</b> Pick one subject, silence distractions, and take a short break when your timer ends. Completed sessions build your focus time and achievements.</div></section><section class="card" style="margin-top:12px"><div class="section-title">📊 Your focus progress</div><div class="week-grid"><div class="week-stat"><b>${activitySince(7).filter(a=>a.type==="focus").length}</b><span>Sessions this week</span></div><div class="week-stat"><b>${activitySince(7).filter(a=>a.type==="focus").reduce((n,a)=>n+(Number(a.value)||0),0)}m</b><span>Minutes this week</span></div><div class="week-stat"><b>${studyStreak()}</b><span>Day streak 🔥</span></div></div></section></div>`}
function updateFocusClock(){let el=document.getElementById("focusTime"),clock=document.getElementById("focusClock"),state=document.getElementById("focusState");if(!el)return;el.textContent=String(Math.floor(focusSeconds/60)).padStart(2,"0")+":"+String(focusSeconds%60).padStart(2,"0");if(clock)clock.style.setProperty("--focus-progress",((focusInitialSeconds-focusSeconds)/focusInitialSeconds*100)+"%");if(state)state.textContent=focusRunning?"Stay focused":"Paused or ready"}
function setFocusLength(min){if(focusRunning)return alert("Pause or save the current session before changing the timer.");focusInitialSeconds=min*60;focusSeconds=focusInitialSeconds;render()}
function startFocus(){if(focusSeconds<=0)focusSeconds=focusInitialSeconds;if(focusRunning)return;focusRunning=true;focusStartedAt=Date.now();if(focusTimer)clearInterval(focusTimer);focusTimer=setInterval(()=>{if(focusSeconds>0)focusSeconds--;updateFocusClock();if(focusSeconds<=0){focusRunning=false;clearInterval(focusTimer);focusTimer=null;recordFocus(Math.round(focusInitialSeconds/60),true)}},1000);updateFocusClock();setStatus("Focus session started")}
function pauseFocus(){if(!focusRunning)return;focusRunning=false;if(focusTimer)clearInterval(focusTimer);focusTimer=null;updateFocusClock();setStatus("Focus timer paused")}
function finishFocus(){let elapsed=Math.round((focusInitialSeconds-focusSeconds)/60);if(focusRunning)pauseFocus();if(elapsed<1)return alert("Complete at least one minute before saving a focus session.");recordFocus(elapsed,false)}
function recordFocus(mins,completed){let task=(document.getElementById("focusTask")?.value||"").trim()||"Focus session";logActivity("focus",task,mins);saveData(true);focusRunning=false;if(focusTimer)clearInterval(focusTimer);focusTimer=null;setStatus((completed?"🎉 Timer complete! ":"✓ Focus session saved: ")+mins+" min");focusSeconds=focusInitialSeconds;render()}
function resetFocus(){if(focusRunning)pauseFocus();focusSeconds=focusInitialSeconds;updateFocusClock();if(page==="focus")render();setStatus("Focus timer reset")}

 if(ACCOUNT_TOKEN&&ACCOUNT_PROFILE){c.innerHTML=`<div class="page-title">👤 My Account</div><div class="v5-page"><section class="v5-card"><div class="v5-row"><div class="v5-feature-icon">👤</div><div><h3>${esc(ACCOUNT_PROFILE.name||"Student")}</h3><p>${esc(ACCOUNT_PROFILE.email||"")}</p></div></div><div class="v5-success" style="margin-top:12px">✓ Signed in. Your account data can sync between devices when connected.</div><div class="v5-actions" style="margin-top:13px"><button class="green" onclick="syncNow()">☁️ Sync now</button><button class="purple" onclick="changeAccountPasswordUI()">🔑 Change password</button><button class="red" onclick="logoutMgcAccount()">↪ Sign out</button></div></section><section class="v5-card"><h3>Account privacy</h3><p class="v5-hint">Your data is saved under this app account. Keep your password private and use Export Backup in Settings regularly. This project stores account records and data files in the Google Apps Script owner's storage.</p><button class="red" onclick="deleteMgcAccountUI()">Delete my account and cloud data</button></section></div>`;return}

function registerMgcAccount(e){e.preventDefault();if(!hasAppsScript())return alert("Open the deployed Google Apps Script web app to create an account.");let name=document.getElementById("signupName").value.trim(),email=document.getElementById("signupEmail").value.trim(),password=document.getElementById("signupPassword").value;if(password.length<8)return alert("Use at least 8 characters for your password.");setStatus("Creating account…");google.script.run.withSuccessHandler(activateMgcAccount).withFailureHandler(err=>{setStatus("Account creation failed");alert(err&&err.message||"Could not create account")}).mgcRegisterAccount(email,name,password)}
function loginMgcAccount(e){e.preventDefault();if(!hasAppsScript())return alert("Open the deployed Google Apps Script web app to sign in.");let email=document.getElementById("loginEmail").value.trim(),password=document.getElementById("loginPassword").value;setStatus("Signing in…");google.script.run.withSuccessHandler(activateMgcAccount).withFailureHandler(err=>{setStatus("Sign-in failed");alert(err&&err.message||"Check your email and password")}).mgcLoginAccount(email,password)}
function activateMgcAccount(r){if(!r||!r.token||!r.profile){alert("The server returned an incomplete account response.");return}let currentSnapshot=JSON.stringify(data),hadData=hasMeaningfulData(data);ACCOUNT_TOKEN=r.token;ACCOUNT_PROFILE=r.profile;CLOUD_READY=true;localStorage.setItem("MGC_ACCOUNT_TOKEN",ACCOUNT_TOKEN);localStorage.setItem("MGC_ACCOUNT_PROFILE",JSON.stringify(ACCOUNT_PROFILE));STORAGE_KEY="MGC_ACCOUNT_DATA_"+String(ACCOUNT_PROFILE.email||"account").toLowerCase().replace(/[^a-z0-9]+/g,"_");let local=localStorage.getItem(STORAGE_KEY);if(local){try{data=normaliseData(JSON.parse(local))}catch(_){data=emptyData()}}setStatus("Account connected · loading cloud data…");google.script.run.withSuccessHandler(result=>{if(result&&result.data){try{hydrate(JSON.parse(result.data));setStatus("✓ Signed in and account data loaded")}catch(err){alert("Your account backup could not be opened: "+err.message)}}else if(hadData&&confirm("This account has no cloud backup yet. Copy the data currently open on this device into this account?")){try{data=normaliseData(JSON.parse(currentSnapshot));saveData();setStatus("✓ Existing data copied to your account")}catch(err){setStatus("Could not copy local data: "+err.message)}}else{if(!local)data=emptyData();writeLocal();saveData(true);setStatus("✓ Account ready · data is saved locally and will sync")}page="account";render()}).withFailureHandler(err=>{setStatus("Signed in, but cloud data could not be loaded. Local data is kept.");page="account";render()}).mgcLoadAccountData(ACCOUNT_TOKEN)}
function hasMeaningfulData(d){return !!(d&&Object.values(d.subjects||{}).some(s=>(s.summative||[]).length||s.final_mark!=="")||(d.events||[]).length||Object.values(d.notes||{}).some(n=>String(n||"").trim()))}
function logoutMgcAccount(){if(!confirm("Sign out of this account on this device? Your saved local and cloud data will remain."))return;let oldToken=ACCOUNT_TOKEN;if(hasAppsScript()&&oldToken)google.script.run.mgcLogoutAccount(oldToken);ACCOUNT_TOKEN="";ACCOUNT_PROFILE=null;CLOUD_READY=false;localStorage.removeItem("MGC_ACCOUNT_TOKEN");localStorage.removeItem("MGC_ACCOUNT_PROFILE");STORAGE_KEY="gradeCalculatorData";let raw=localStorage.getItem(STORAGE_KEY);data=raw?normaliseData(JSON.parse(raw)):emptyData();page="account";render();setStatus("Signed out · local browser mode")}
function changeAccountPasswordUI(){let oldPass=prompt("Current password:");if(oldPass===null)return;let next=prompt("New password (at least 8 characters):");if(next===null)return;if(next.length<8)return alert("Use at least 8 characters.");google.script.run.withSuccessHandler(()=>alert("Password changed successfully.")).withFailureHandler(e=>alert(e&&e.message||"Password change failed")).mgcChangePassword(ACCOUNT_TOKEN,oldPass,next)}
function deleteMgcAccountUI(){if(!confirm("Delete your app account and its cloud data permanently? Export a backup first if you need it."))return;let pass=prompt("Enter your password to confirm deletion:");if(pass===null)return;google.script.run.withSuccessHandler(()=>{ACCOUNT_TOKEN="";ACCOUNT_PROFILE=null;CLOUD_READY=false;localStorage.removeItem("MGC_ACCOUNT_TOKEN");localStorage.removeItem("MGC_ACCOUNT_PROFILE");STORAGE_KEY="gradeCalculatorData";data=emptyData();page="account";render();setStatus("Account deleted")}).withFailureHandler(e=>alert(e&&e.message||"Account deletion failed")).mgcDeleteAccount(ACCOUNT_TOKEN,pass)}

ontent at once)</label><label class="v5-toggle"><input id="studioWeekly" type="checkbox" ${p.showWeekly?"checked":""}> Show weekly activity chart</label><label class="v5-toggle"><input id="studioUpcoming" type="checkbox" ${p.showUpcoming?"checked":""}> Show upcoming tasks on dashboard</label><label class="v5-toggle"><input id="studioGlow" type="checkbox" ${p.glow?"checked":""}> Soft background glow</label></div><div class="v5-actions" style="margin-top:14px"><button class="green" onclick="savePersonalization()">Save appearance</button><button class="accent" onclick="resetPersonalization()">Reset appearance</button></div></section></div>`}

function offlinePage(c){let online=navigator.onLine;c.innerHTML=`<div class="page-title">📴 Offline Mode</div><div class="v5-page"><section class="v5-card"><div class="v5-row"><div class="v5-feature-icon">${online?"🌐":"📴"}</div><div><h3>${online?"Connection available":"You are offline"}</h3><p>${online?"Changes save on this device and can sync when signed in.":"Your already-open app keeps saving changes locally. Sync will resume when the internet returns."}</p></div></div><div class="v5-warning" style="margin-top:12px">Offline mode pauses cloud sync, but local saving continues. A browser page hosted by Apps Script may still need internet to open again after it is closed; export a backup before working offline for a long time.</div><label class="v5-toggle" style="margin-top:14px"><input id="offlineToggle" type="checkbox" ${data.offlineMode?"checked":""} onchange="toggleOfflineMode(this.checked)"> Work offline (pause cloud sync)</label><div class="v5-actions" style="margin-top:13px"><button class="accent" onclick="exportData()">⬇ Export JSON backup</button><button class="purple" onclick="document.getElementById('importOfflineFile').click()">⬆ Import backup</button><button class="green" onclick="syncNow()" ${!cloudAvailable()||data.offlineMode?"disabled":""}>☁️ Sync now</button></div><input type="file" id="importOfflineFile" accept="application/json,.json" hidden onchange="importDataFile(this)"><div class="v5-mini" style="margin-top:12px">Network status: ${online?"Online":"Offline"} · Local storage: active · Account: ${ACCOUNT_PROFILE?esc(ACCOUNT_PROFILE.email):"not signed in"}</div></section></div>`}

function examGeneratorPage(c){c.innerHTML=`<div class="page-title">🧠 AI Exam Generator</div><div class="v5-page"><section class="v5-card"><div class="v5-row"><div class="v5-feature-icon">🧠</div><div><h3>Create a practice test</h3><p>Choose a subject and topic. AI generates questions, answer choices, solutions, and explanations.</p></div></div><div class="v5-warning" style="margin-top:12px">Requires an account sign-in and a Gemini API key saved in Apps Script → Project Settings → Script properties as <b>GEMINI_API_KEY</b>.</div><form class="v5-form" style="margin-top:14px" onsubmit="generatePracticeExamUI(event)"><div class="v5-grid"><label>Subject<select id="examSubject">${SUBJECTS.map(s=>`<option>${esc(s)}</option>`).join("")}</select></label><label>School grade<select id="examSchoolGrade">${[5,6,7,8,9,10,11].map(g=>`<option value="${g}">Grade ${g}</option>`).join("")}</select></label><label>Topic<input id="examTopic" required maxlength="200" placeholder="e.g. fractions, cells, World War II"></label><label>Difficulty<select id="examDifficulty"><option>Easy</option><option selected>Medium</option><option>Hard</option></select></label><label>Number of questions<select id="examCount"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></label><label>Answer language<select id="examLanguage"><option>English</option><option>Uzbek</option><option>Russian</option></select></label></div><button id="examGenerateButton" class="green" type="submit">✨ Generate practice exam</button></form></section><section class="v5-card"><div class="section-title">Your generated exam</div><div id="examResult" class="v5-output">Your questions will appear here. Copy or print them for revision.</div><div class="v5-actions" style="margin-top:10px"><button class="accent" onclick="copyExamResult()">📋 Copy exam</button><button class="purple" onclick="printExamResult()">🖨️ Print / Save PDF</button></div></section></div>`}
function generatePracticeExamUI(e){e.preventDefault();if(!ACCOUNT_TOKEN)return alert("Sign in to your app account first.");if(!hasAppsScript())return alert("Open the deployed Apps Script web app first.");let req={subject:document.getElementById("examSubject").value,grade:document.getElementById("examSchoolGrade").value,topic:document.getElementById("examTopic").value.trim(),difficulty:document.getElementById("examDifficulty").value,count:Number(document.getElementById("examCount").value),language:document.getElementById("examLanguage").value};let btn=document.getElementById("examGenerateButton"),out=document.getElementById("examResult");btn.disabled=true;btn.textContent="Generating…";out.textContent="AI is preparing your exam. This can take a few seconds.";google.script.run.withSuccessHandler(r=>{btn.disabled=false;btn.textContent="✨ Generate practice exam";out.textContent=r&&r.text||"No exam was returned.";logActivity("exam_generated",req.subject+": "+req.topic);saveData(true)}).withFailureHandler(err=>{btn.disabled=false;btn.textContent="✨ Generate practice exam";out.textContent="Could not generate the exam: "+(err&&err.message||"Unknown error");}).mgcGenerateExam(ACCOUNT_TOKEN,req)}

function makeParentSnapshot(){let o=overall(),b=best((a,x)=>a>x),f=best((a,x)=>a<x);return{studentName:ACCOUNT_PROFILE?.name||"Student",accountEmail:ACCOUNT_PROFILE?.email||"",createdAt:new Date().toISOString(),goal:Number(data.goal)||80,overall:o,currentGrade:o===null?null:grade(o),best:b?{name:b[0],mark:b[1]}:null,weakest:f?{name:f[0],mark:f[1]}:null,subjects:SUBJECTS.map(s=>{let d=data.subjects[s],avg=d.summative.length?d.summative.reduce((a,b)=>a+b,0)/d.summative.length:null;return{name:s,average:avg,finalMark:d.final_mark===""?null:Number(d.final_mark),grade:d.grade===""?null:Number(d.grade)}}),upcoming:data.events.filter(e=>!e.done&&e.date>=localDateString(new Date())).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||""))).slice(0,8).map(e=>({name:e.name,date:e.date,type:e.type,priority:e.priority}))}}
function parentPage(c){let snap=makeParentSnapshot();c.innerHTML=`<div class="page-title">👨‍👩‍👧 Parent View</div><div class="v5-page"><section class="v5-card"><h3>Read-only progress for your parent or guardian</h3><p class="v5-hint">Create a private link containing an academic snapshot. Anyone with the link can view it, so share it only with a trusted person. The link expires after 30 days and can be revoked here.</p><div class="v5-actions" style="margin-top:12px"><button class="green" onclick="createParentShareUI()">🔗 Create parent link</button><button class="red" onclick="revokeParentShareUI()" ${!ACCOUNT_TOKEN?"disabled":""}>Revoke existing link</button></div><div id="parentShareResult" class="v5-output" style="margin-top:10px">${ACCOUNT_TOKEN?"No new link created in this session yet.":"Sign in first to create a secure share link."}</div></section><section class="v5-card"><div class="section-title">📄 Preview of shared report</div>${parentSnapshotHtml(snap,false)}<div class="v5-actions no-print" style="margin-top:12px"><button class="accent" onclick="printParentSnapshot()">🖨️ Print / Save PDF</button></div></section></div>`}
function parentSnapshotHtml(s,publicMode){return `<div class="parent-report-header"><h1>🎓 Student progress report</h1><p>${esc(s.studentName||"Student")} · Prepared ${esc(new Date(s.createdAt||Date.now()).toLocaleDateString())}</p></div><div class="cards" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="card"><div class="metric-title">Overall average</div><div class="metric-value">${s.overall===null||s.overall===undefined?"—":Number(s.overall).toFixed(1)+"%"}</div></div><div class="card"><div class="metric-title">Current grade</div><div class="metric-value">${s.currentGrade||"—"}</div></div><div class="card"><div class="metric-title">Goal</div><div class="metric-value">${Number(s.goal)||80}%</div></div></div><div class="v5-card" style="margin-top:12px"><div class="section-title">Subject results</div><table class="v5-report-table"><thead><tr><th>Subject</th><th>Summative avg.</th><th>Final mark</th><th>Grade</th></tr></thead><tbody>${(s.subjects||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.average===null||x.average===undefined?"—":Number(x.average).toFixed(1)+"%"}</td><td>${x.finalMark===null||x.finalMark===undefined?"—":Number(x.finalMark).toFixed(1)+"%"}</td><td>${x.grade||"—"}</td></tr>`).join("")}</tbody></table></div>${s.upcoming&&s.upcoming.length?`<div class="v5-card" style="margin-top:12px"><div class="section-title">Upcoming tasks</div>${s.upcoming.map(e=>`<div class="schedule-week-item"><span>${esc(e.date)}</span><b>${esc(e.name)} · ${esc(e.type||"Task")}</b></div>`).join("")}</div>`:""}`}
function createParentShareUI(){if(!ACCOUNT_TOKEN)return alert("Sign in to your account first.");let out=document.getElementById("parentShareResult");out.textContent="Creating private parent link…";google.script.run.withSuccessHandler(r=>{out.innerHTML=`<div class="v5-success">Link created. It expires on ${esc(new Date(r.expiresAt).toLocaleDateString())}.</div><input id="parentShareUrl" value="${esc(r.url)}" readonly style="width:100%;margin-top:8px"><div class="v5-actions" style="margin-top:8px"><button class="accent" onclick="copyParentShareUrl()">📋 Copy parent link</button></div>`}).withFailureHandler(e=>{out.textContent=e&&e.message||"Could not create parent link."}).mgcCreateParentShare(ACCOUNT_TOKEN,makeParentSnapshot())}
function copyParentShareUrl(){let el=document.getElementById("parentShareUrl");if(!el)return;navigator.clipboard?.writeText(el.value).then(()=>setStatus("Parent link copied")).catch(()=>prompt("Copy this link:",el.value))||prompt("Copy this link:",el.value)}
function revokeParentShareUI(){if(!ACCOUNT_TOKEN)return;if(!confirm("Revoke the parent link? Anyone using it will no longer be able to open the report."))return;google.script.run.withSuccessHandler(()=>{let el=document.getElementById("parentShareResult");if(el)el.textContent="Parent link revoked.";setStatus("Parent link revoked")}).withFailureHandler(e=>alert(e&&e.message||"Could not revoke link")).mgcRevokeParentShare(ACCOUNT_TOKEN)}
function printParentSnapshot(){let w=window.open("","_blank");if(!w)return alert("Allow pop-ups to print the report.");w.document.write("<!doctype html><html><head><title>Student Progress Report</title><meta charset='utf-8'><style>body{font:14px Arial;color:#111;max-width:900px;margin:25px auto;padding:0 20px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}.card,.v5-card{border:1px solid #ddd;padding:12px;margin:10px 0;border-radius:8px}.parent-report-header{background:#f1f7f3;padding:15px;border-radius:8px}p{line-height:1.5}</style></head><body></body></html>");w.document.body.innerHTML=parentSnapshotHtml(makeParentSnapshot(),false);w.document.close();w.print()}
function isParentTokenValid(){return /^[A-Za-z0-9_-]{20,100}$/.test(DEPLOYED_PARENT_SHARE_TOKEN||"")}
function loadPublicParentView(){document.querySelector(".header")?.setAttribute("hidden","");document.querySelector(".layout")?.setAttribute("hidden","");document.getElementById("status")?.setAttribute("hidden","");let root=document.getElementById("parentReportRoot");root.hidden=false;root.innerHTML="<section class='v5-card'>Loading shared progress report…</section>";if(!hasAppsScript()){root.innerHTML="<section class='v5-card'>This parent report must be opened using the deployed web app link.</section>";return}google.script.run.withSuccessHandler(s=>{if(!s){root.innerHTML="<section class='v5-card'>This share link is invalid, expired, or has been revoked.</section>";return}root.innerHTML=parentSnapshotHtml(s,true)+"<button class='accent no-print' onclick='window.print()' style='margin-top:12px'>Print / Save PDF</button><p class='v5-mini'>Read-only report · My Grade Calculator</p>"}).withFailureHandler(()=>{root.innerHTML="<section class='v5-card'>Could not load the parent report. Check the link and internet connection.</section>"}).mgcLoadParentView(DEPLOYED_PARENT_SHARE_TOKEN)}

function initialiseApp(){let token=localStorage.getItem("MGC_ACCOUNT_TOKEN")||"";let startLocal=()=>{let raw=localStorage.getItem(STORAGE_KEY)||localStorage.getItem("gradeCalculatorData");if(raw){try{data=normaliseData(JSON.parse(raw))}catch(_){data=emptyData()}}applyTheme();render();setStatus(navigator.onLine?"Ready · local browser saving":"Offline · local saving active")};if(token&&hasAppsScript()){google.script.run.withSuccessHandler(profile=>{if(profile&&profile.email){ACCOUNT_TOKEN=token;ACCOUNT_PROFILE=profile;CLOUD_PROFILE=profile;CLOUD_READY=true;STORAGE_KEY="MGC_ACCOUNT_DATA_"+String(profile.email).toLowerCase().replace(/[^a-z0-9]+/g,"_");localStorage.setItem("MGC_ACCOUNT_PROFILE",JSON.stringify(profile));startLocal();if(!data.offlineMode)reconcileCloud()}else{localStorage.removeItem("MGC_ACCOUNT_TOKEN");ACCOUNT_TOKEN="";ACCOUNT_PROFILE=null;STORAGE_KEY="gradeCalculatorData";startLocal()}}).withFailureHandler(()=>{ACCOUNT_TOKEN="";ACCOUNT_PROFILE=null;CLOUD_READY=false;STORAGE_KEY="gradeCalculatorData";startLocal();setStatus("Account session expired or server unavailable · local data remains safe")}).mgcValidateAccount(token)}else{ACCOUNT_TOKEN="";ACCOUNT_PROFILE=null;CLOUD_READY=false;STORAGE_KEY="gradeCalculatorData";startLocal()}}
function reconcileCloud(){if(!cloudAvailable()||data.offlineMode)return;google.script.run.withSuccessHandler(r=>{if(r&&r.data){let cloud;try{cloud=normaliseData(JSON.parse(r.data))}catch(e){setStatus("Cloud backup is invalid; local copy kept.");return}let localRaw=localStorage.getItem(STORAGE_KEY),local=localRaw?normaliseData(JSON.parse(localRaw)):null;let lt=local&&local.updatedAt?Date.parse(local.updatedAt):0,ct=cloud.updatedAt?Date.parse(cloud.updatedAt):Date.parse(r.updatedAt||0);if(!local||ct>lt){data=cloud;writeLocal();applyTheme();render();setStatus("✓ Latest account backup loaded")}else if(lt>ct){pushCloudData();setStatus("Local changes found; syncing them to your account…")}else{setStatus("✓ Cloud and device are in sync")}}else{pushCloudData();setStatus("First account backup is being created…")}}).withFailureHandler(()=>setStatus("Cloud sync is unavailable right now; your local copy is safe.")).mgcLoadAccountData(ACCOUNT_TOKEN)}
document.addEventListener("keydown",e=>{if(e.ctrlKey&&e.key.toLowerCase()==="s"){e.preventDefault();saveData()}if(e.ctrlKey&&e.key.toLowerCase()==="l"){e.preventDefault();loadData()}});
if(isParentTokenValid())loadPublicParentView();else initialiseApp();

</script>
